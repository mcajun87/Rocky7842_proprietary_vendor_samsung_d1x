name: Rocky7842_proprietary_vendor_samsung_d1x

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间早上 8:00 自动运行
  workflow_dispatch: # 手动触发开关

jobs:
  sync_all_branches:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == github.actor }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取全量历史和所有分支信息

      - name: Fetch and sync all upstream branches
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. 添加原作者 upstream
          git remote add upstream https://github.com/Rocky7842/proprietary_vendor_samsung_d1x.git
          git fetch upstream

          # 2. ⚠️ 在这里填上你需要同步的所有分支名字（空格隔开）
           BRANCHES=( "lineage-23.2" "lineage-24.0")
          # 3. 循环同步各个分支
          for b in "${BRANCHES[@]}"; do
            echo "=========================================="
            echo "正在处理分支: ${b}"
            echo "=========================================="
            
            # 检查远程 upstream 是否有这个分支
            if ! git ls-remote --exit-code --heads upstream "${b}" >/dev/null; then
              echo "警告: 原作者仓库中不存在分支 ${b}，跳过。"
              continue
            fi

            # 切换/创建本地分支并绑定跟踪
            git checkout -B "${b}" "origin/${b}" || git checkout -b "${b}"
            
            # 合并原作者分支代码
            if git merge "upstream/${b}" --no-edit; then
              echo "分支 ${b} 合并成功，推送到你的 GitHub..."
              git push origin "${b}"
            else
              echo "错误: 分支 ${b} 发生冲突，自动跳过该分支。"
              git merge --abort || true
            fi
          done
